name: Daily Info Digest

on:
  schedule:
    # UTC 22:00 = 北京时间 06:00（早上起床看）
    - cron: '0 22 * * *'
  workflow_dispatch:  # 支持手动触发

permissions:
  contents: write

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure git
        run: |
          git config user.name "Daily Digest Bot"
          git config user.email "bot@daily-digest"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run daily digest
        run: python main.py
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          WECHAT_APPID: ${{ secrets.WECHAT_APPID }}
          WECHAT_SECRET: ${{ secrets.WECHAT_SECRET }}
          WECHAT_TEMPLATE_ID: ${{ secrets.WECHAT_TEMPLATE_ID }}

      - name: Commit and push HTML page
        run: |
          git add public/
          git diff --staged --quiet || git commit -m "update digest page"
          git push
