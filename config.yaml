# === 添加新领域的方法 ===
# 在 interests 列表里加一项即可，格式如下：
#   - name: "领域名"
#     rss_feeds: ["rss地址1", "rss地址2"]
#     keywords: ["关键词1", "keyword2"]
#     max_articles: 5   # 这个领域最多取几条
#
# RSS 和 keywords 可以都填，也可以只填一个
# 没有 RSS 源时，装上 duckduckgo-search 就能用 web 搜索

interests:
  - name: "AI / 大模型"
    rss_feeds:
      - https://news.ycombinator.com/rss
      - https://arxiv.org/rss/cs.AI
      - https://feeds.feedburner.com/TechCrunch
      - https://www.theverge.com/rss/ai-artificial-intelligence/index.xml
    keywords: ["AI", "大模型", "LLM", "GPT", "Claude", "deep learning"]
    max_articles: 5

deepseek:
  model: "deepseek-chat"

push:
  bark:
    # server_url: "https://api.day.app"  # 不设置则默认使用官方地址

  # 微信测试号：启用后自动推送给所有扫码关注的人
  # 无需手动管理 OpenID，脚本自动拉取关注列表
  wechat:
    enabled: false
    # appid_env: WECHAT_APPID
    # secret_env: WECHAT_SECRET
    # template_id_env: WECHAT_TEMPLATE_ID
    # recipients:  # 极少用到：不在关注列表里的额外接收人
    #   - "oXXXXXX..."
